<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseSimulator Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CaseSimulator</div>
        <nav class="main-nav">
            <button onclick="switchTab('cases')">Skrzynki</button>
            <button onclick="switchTab('inventory')">Ekwipunek</button>
        </nav>
        <div class="wallet">
            <span id="balance">100.00</span> zł
        </div>
    </header>

    <main>
        <section id="view-cases" class="view active">
            <div class="hero">
                <h2>Wybierz skrzynkę do otwarcia</h2>
            </div>
            <div class="cases-grid" id="casesGrid"></div>
        </section>

        <section id="view-opening" class="view">
            <button class="back-btn" onclick="switchTab('cases')">&lt; Powrót do skrzynek</button>
            
            <div class="case-header">
                <h2 id="openingCaseName">Nazwa Skrzynki</h2>
                <p class="case-price-subtitle" id="openingCasePriceStr">0,00zł</p>
            </div>
            
            <div class="roulette-wrapper">
                <div class="roulette-window" id="rouletteWindow">
                    <div class="roulette-selector" id="rouletteSelector"></div>
                    <div class="roulette-strip" id="rouletteStrip"></div>
                    <div class="fast-open-results" id="fastOpenResults"></div>
                </div>
            </div>
            
            <div class="case-controls-wrapper">
                <div class="case-controls">
                    <div class="multi-open">
                        <button class="active" onclick="setQuantity(1, this)">1</button>
                        <button onclick="setQuantity(2, this)">2</button>
                        <button onclick="setQuantity(3, this)">3</button>
                        <button onclick="setQuantity(5, this)">5</button>
                        <button onclick="setQuantity(10, this)">10</button>
                    </div>
                    <button id="openCaseBtn" class="main-open-btn">Otwórz za <span id="openingCasePriceBtn">0,00</span>zł</button>
                </div>
            </div>

            <h3 class="contents-title">Zawartość skrzynki</h3>
            <div class="contents-grid-new" id="caseContentsGrid"></div>
        </section>

        <section id="view-inventory" class="view">
            <div class="inventory-header">
                <h2>Twój Ekwipunek</h2>
                <div class="inventory-stats">
                    <span>Łączna wartość: <b id="totalValue" style="color: #06b6d4;">0.00 zł</b></span>
                    <button class="sell-all-btn" onclick="sellAll()">Sprzedaj wszystko</button>
                </div>
            </div>
            <div class="contents-grid-new" id="inventoryGrid"></div>
        </section>
    </main>

    <div id="resultModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Wynik otwarcia</h2>
            <div id="modalItems" class="modal-items-grid"></div>
            <div class="modal-summary" id="modalSummary"></div>
            <button class="modal-close-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
