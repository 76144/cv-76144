<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseSimulator Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CaseSimulator</div>
        <nav class="main-nav">
            <button onclick="switchTab('cases')">Skrzynki</button>
            <button onclick="switchTab('inventory')">Ekwipunek</button>
        </nav>
        <div class="wallet">
            <span id="balance">100.00</span> zł
        </div>
    </header>

    <main>
        <section id="view-cases" class="view active">
            <div class="hero">
                <div class="hero-content">
                    <h2>Wybierz skrzynkę do otwarcia</h2>
                </div>
            </div>
            <div class="cases-grid" id="casesGrid"></div>
        </section>

        <section id="view-opening" class="view">
            <button class="back-btn" onclick="switchTab('cases')">&lt; Powrót do skrzynek</button>
            
            <div class="case-header">
                <h2 id="openingCaseName">👑 Nature Case</h2>
                <p class="case-price-subtitle" id="openingCasePriceStr">2,30zł</p>
            </div>
            
            <div class="roulette-wrapper">
                <div class="roulette-window">
                    <div class="roulette-selector"></div>
                    <div class="roulette-strip" id="rouletteStrip"></div>
                </div>
            </div>
            
            <div class="case-controls">
                <div class="multi-open">
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button disabled>🔒 4</button>
                    <button disabled>🔒 5</button>
                </div>
                <button id="openCaseBtn" class="main-open-btn">Otwórz za <span id="openingCasePriceBtn">2,30</span>zł</button>
                <div class="extra-toggles">
                    <button>👑</button>
                    <button>⚡</button>
                    <button>🔊</button>
                </div>
            </div>

            <div class="battle-btn-wrapper">
                <button class="battle-btn">+ Stwórz Case Battle z tą skrzynką</button>
            </div>

            <h3 class="contents-title">Zawartość skrzynki</h3>
            <div class="contents-grid-new" id="caseContentsGrid"></div>
        </section>

        <section id="view-inventory" class="view">
            <div class="inventory-header">
                <h2>Twój Ekwipunek</h2>
                <div class="inventory-stats">
                    <span>Łączna wartość: <b id="totalValue" style="color: #06b6d4;">0.00 zł</b></span>
                    <button class="sell-all-btn" onclick="sellAll()">Sprzedaj wszystko</button>
                </div>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
