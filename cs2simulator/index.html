<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseSimulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CaseSimulator</div>
        <div class="wallet">
            <span id="balance">100.00</span> zł
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Odbierz darmową skrzynkę!</h2>
                <p>Dostępna co 8 godzin dla aktywnych graczy.</p>
                <button>OTWÓRZ SKRZYNKĘ</button>
            </div>
        </section>

        <section class="cases-section">
            <h3>Skrzynki standardowe</h3>
            <div class="cases-grid" id="casesGrid">
                </div>
        </section>

        <section class="inventory-section">
            <h3>Twój Ekwipunek</h3>
            <div class="inventory-grid" id="inventoryGrid">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
