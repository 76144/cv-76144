<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseSimulator Pro - Ultra Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <header>
        <div class="logo">
            <span class="logo-icon">💠</span> CaseSimulator <span class="pro-badge">PRO</span>
        </div>
        <nav class="main-nav">
            <button onclick="switchTab('cases')" class="nav-btn">Skrzynki</button>
            <button onclick="switchTab('inventory')" class="nav-btn">Ekwipunek</button>
        </nav>
        <div class="wallet pulse-glow">
            <span id="balance">1000.00</span> zł
        </div>
    </header>

    <main>
        <section id="view-cases" class="view active">
            <div class="hero fade-in">
                <h2>Wybierz skrzynkę do otwarcia</h2>
                <p>Przygotuj się na najlepsze dropy.</p>
            </div>
            <div class="cases-grid stagger-animate" id="casesGrid"></div>
        </section>

        <section id="view-opening" class="view">
            <button class="back-btn" onclick="switchTab('cases')">
                <span class="arrow">&lt;</span> Powrót do skrzynek
            </button>
            
            <div class="case-header fade-in">
                <h2 id="openingCaseName" class="neon-text">Nazwa Skrzynki</h2>
                <p class="case-price-subtitle" id="openingCasePriceStr">0,00zł</p>
            </div>
            
            <div class="roulette-wrapper fade-in delay-1">
                <div class="roulette-window glass-panel" id="rouletteWindow">
                    <div class="roulette-selector" id="rouletteSelector"></div>
                    <div class="roulette-strip" id="rouletteStrip"></div>
                    <div class="fast-open-results" id="fastOpenResults"></div>
                </div>
            </div>
            
            <div class="case-controls-wrapper fade-in delay-2">
                <div class="case-controls glass-panel">
                    <div class="multi-open">
                        <button class="active" onclick="setQuantity(1, this)">1</button>
                        <button onclick="setQuantity(2, this)">2</button>
                        <button onclick="setQuantity(3, this)">3</button>
                        <button onclick="setQuantity(5, this)">5</button>
                        <button onclick="setQuantity(10, this)">10</button>
                    </div>
                    <button id="openCaseBtn" class="main-open-btn glow-effect">
                        Otwórz za <span id="openingCasePriceBtn">0,00</span>zł
                    </button>
                </div>
            </div>

            <h3 class="contents-title fade-in delay-3">Zawartość skrzynki</h3>
            <div class="contents-grid-new stagger-animate" id="caseContentsGrid"></div>
        </section>

        <section id="view-inventory" class="view">
            <div class="inventory-header fade-in">
                <h2>Twój Ekwipunek</h2>
                <div class="inventory-stats glass-panel">
                    <span>Łączna wartość: <b id="totalValue" class="neon-text-green">0.00 zł</b></span>
                    <button class="sell-all-btn glow-effect-red" onclick="sellAll()">Sprzedaj wszystko</button>
                </div>
            </div>
            <div class="contents-grid-new stagger-animate" id="inventoryGrid"></div>
        </section>
    </main>

    <div id="resultModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">Wynik otwarcia</div>
            <div id="modalItems" class="modal-items-grid"></div>
            <div class="modal-summary" id="modalSummary"></div>
            <button class="modal-close-btn glow-effect" onclick="closeModal()">NIESAMOWITE, DZIĘKI!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
