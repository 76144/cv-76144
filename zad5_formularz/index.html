<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Kacper Pietrak - 76144</title>
    <link id="theme-link" rel="stylesheet" href="green.css">
</head>
<body>

    <main>
        <header>
            <h1>Kacper Pietrak - CV</h1>
            <img src="moje_zdjecie.jpg.png" alt="Zdjęcie profilowe">
            
            <div style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button id="btn-theme" style="padding: 8px 16px; cursor: pointer;">Zmień motyw (Red/Green)</button>
                <button id="btn-toggle-projects" style="padding: 8px 16px; cursor: pointer;">Pokaż/Ukryj Projekty</button>
            </div>
        </header>

        <section id="sekcja-projekty">
            <h2>Projekty</h2>
            <ul>
                <li><strong>Osobiste CV</strong>: Projekt strony wizytówki.</li>
                <li><strong>Diagnostyka OBD-II</strong>: Projekt bazy danych pojazdów.</li>
            </ul>
        </section>

        <section id="kontakt">
            <h2>Napisz do mnie</h2>
            
            <div id="success-message" style="display: none; background-color: #dcfce7; color: #166534; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #16a34a; text-align: center;">
                Formularz został wysłany poprawnie!
            </div>

            <form id="contactForm" novalidate>
                <div class="form-row">
                    <label for="imie">Imię:</label>
                    <div class="input-container">
                        <input type="text" id="imie" placeholder="Wpisz imię...">
                        <span id="error-imie" class="error-message"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="nazwisko">Nazwisko:</label>
                    <div class="input-container">
                        <input type="text" id="nazwisko" placeholder="Wpisz nazwisko...">
                        <span id="error-nazwisko" class="error-message"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="email">E-mail:</label>
                    <div class="input-container">
                        <input type="email" id="email" placeholder="np. jan@kowalski.pl">
                        <span id="error-email" class="error-message"></span>
                    </div>
                </div>

                <div class="form-row">
                    <label for="wiadomosc">Wiadomość:</label>
                    <div class="input-container">
                        <textarea id="wiadomosc" rows="4" placeholder="Twoja wiadomość..."></textarea>
                        <span id="error-wiadomosc" class="error-message"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-placeholder"></div>
                    <button type="submit" id="submit-btn" style="padding: 10px 20px; background-color: #15803d; color: white; border: none; cursor: pointer; font-weight: bold;">Wyślij formularz</button>
                </div>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
